<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparateur Hypershell — FR / EN</title>
<style>
  :root{
    --blue:#3643BA;--blue-dark:#16175D;--mint:#54CFA1;
    --page:#f4f5fa;--card:#ffffff;--line:#e3e5ef;--txt:#16175D;--muted:#6c6f86;--head:#f4f5fb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Decathlon Sans",Arial,sans-serif;
    background:var(--page);color:var(--txt);
    line-height:1.5;padding:0 0 80px;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:28px 16px 0}
  .langbar{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
  .langbtn{border:1.5px solid var(--line);background:#fff;color:var(--muted);font-family:inherit;
    font-size:.9rem;font-weight:600;padding:8px 20px;border-radius:22px;cursor:pointer}
  .langbtn.active{background:var(--blue);border-color:var(--blue);color:#fff}
  h1{font-size:2.4rem;font-weight:600;letter-spacing:-.02em;margin-bottom:26px;color:var(--blue-dark);text-align:center}

  .tablescroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 2px 14px rgba(22,23,93,.05)}
  .inner{min-width:760px}
  .heads{display:grid;grid-template-columns:210px repeat(3,1fr)}
  .head-cell{padding:18px 16px;text-align:center;border-bottom:2px solid var(--line);display:flex;flex-direction:column;align-items:center}
  .head-cell.corner{border-bottom:2px solid var(--line)}
  .head-name{font-weight:600;font-size:1.1rem;color:var(--blue-dark);margin-bottom:6px}
  .badge-row{min-height:22px;margin-bottom:8px;display:flex;align-items:center;justify-content:center}
  .badge{font-size:.66rem;font-weight:600;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em}
  .badge-gold{background:#F4C84F;color:#4a3800}
  .badge-blue{background:var(--blue);color:#fff}
  .badge-navy{background:var(--blue-dark);color:#fff}
  .profil{display:inline-block;background:#eef0fb;color:var(--blue);font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:20px;margin-bottom:8px}
  .head-tag{font-size:.78rem;color:var(--muted);min-height:72px}
  .head-price{font-size:1.25rem;font-weight:600;color:var(--blue);margin-top:auto;padding-top:12px}

  table{width:100%;border-collapse:collapse;table-layout:fixed}
  col.label-col{width:210px}
  th,td{padding:13px 16px;font-size:.88rem;vertical-align:middle;border-bottom:1px solid var(--line)}
  th.rowlabel{text-align:left;font-weight:600;color:var(--blue-dark);background:var(--head)}
  .rowdesc{display:block;font-weight:400;font-size:.72rem;color:var(--muted);margin-top:3px;max-width:340px}
  td{text-align:center;color:var(--txt)}
  td.same{color:#aeb1c6;font-weight:400}
  td .mini{white-space:pre-line;font-size:.82rem;line-height:1.45;color:var(--muted)}
  tr.rowdiff th.rowlabel{box-shadow:inset 3px 0 0 var(--blue)}
  tr.data:hover td,tr.data:hover th.rowlabel{background:#eef0fb}
  .yes{color:var(--blue);font-weight:600}
  .no{color:#b8bac9}
  .section-row th{background:var(--blue);color:#fff;letter-spacing:.01em;font-size:.74rem;font-weight:600;padding:11px 16px;border-bottom:none}

  .reassure{max-width:1200px;margin:22px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .rz{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:center}
  .rz b{display:block;color:var(--blue-dark);font-size:.9rem}

  .accessories{background:var(--blue-dark);margin-top:40px;padding:32px 16px}
  .acc-inner{max-width:1200px;margin:0 auto}
  .acc-inner h2{color:#fff;font-size:1.25rem;font-weight:600;margin-bottom:18px;text-align:center}
  .acc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .acc-card{background:#fff;border-radius:12px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center}
  .acc-img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:8px;margin-bottom:4px}
  .acc-name{font-weight:600;font-size:.9rem;color:var(--blue-dark)}
  .acc-desc{font-size:.75rem;color:var(--muted);line-height:1.4;flex:1}
  .acc-price{font-weight:600;font-size:1.05rem;color:var(--blue);margin-top:4px}

  @media(max-width:900px){.acc-grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:640px){
    h1{font-size:1.7rem}
    .acc-grid{grid-template-columns:repeat(2,1fr)}
    .reassure{grid-template-columns:1fr}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="langbar">
      <button class="langbtn" id="btn-fr" onclick="setLang('fr')">Français</button>
      <button class="langbtn" id="btn-en" onclick="setLang('en')">English</button>
    </div>
    <h1 id="title"></h1>
    <div class="tablescroll">
      <div class="inner">
        <div class="heads" id="heads"></div>
        <table><colgroup><col class="label-col"><col><col><col></colgroup><tbody id="tbody"></tbody></table>
      </div>
    </div>
    <div class="reassure" id="reassure"></div>
  </div>
  <section class="accessories">
    <div class="acc-inner">
      <h2 id="accTitle"></h2>
      <div class="acc-grid" id="accGrid"></div>
    </div>
  </section>

let LANG="fr";

function cellVal(text,isMini,D){
  if(isMini)return `<span class="mini">${text}</span>`;
  const t=text.trim();
  if(t===D.yes)return `<span class="yes">${D.yes}</span>`;
  if(t===D.no)return `<span class="no">${D.no}</span>`;
  return text;
}

function render(){
  const D=DATA[LANG];
  document.documentElement.lang=LANG;
  document.getElementById("btn-fr").classList.toggle("active",LANG==="fr");
  document.getElementById("btn-en").classList.toggle("active",LANG==="en");
  document.getElementById("title").textContent=D.title;

  // heads
  let h=`<div class="head-cell corner"></div>`;
  D.models.forEach(m=>{
    const badge=`<div class="badge-row">${m.badge?`<span class="badge ${m.badgeClass}">${m.badge}</span>`:""}</div>`;
    h+=`<div class="head-cell"><div class="head-name">${m.name}</div>${badge}<div class="profil">${m.profil}</div><div class="head-tag">${m.tag}</div><div class="head-price">${m.price}</div></div>`;
  });
  document.getElementById("heads").innerHTML=h;

  // body
  let rows="";
  D.sections.forEach(sec=>{
    rows+=`<tr class="section-row"><th class="rowlabel" colspan="4">${sec.title}</th></tr>`;
    sec.rows.forEach(r=>{
      const allSame=r.v.every(x=>x===r.v[0]);
      rows+=`<tr class="data ${allSame?'rowsame':'rowdiff'}"><th class="rowlabel">${r.label}${r.desc?`<span class="rowdesc">${r.desc}</span>`:""}</th>`;
      r.v.forEach(val=>{rows+=`<td class="${allSame?'same':''}">${cellVal(val,r.mini,D)}</td>`;});
      rows+=`</tr>`;
    });
  });
  document.getElementById("tbody").innerHTML=rows;

  // reassure
  document.getElementById("reassure").innerHTML=D.reassure.map(x=>`<div class="rz"><b>${x}</b></div>`).join("");

  // accessories
  document.getElementById("accTitle").textContent=D.accTitle;
  document.getElementById("accGrid").innerHTML=D.acc.map((a,i)=>
    `<div class="acc-card"><img class="acc-img" src="${ACC_IMG[i]}" alt="${a.name}" loading="lazy"><span class="acc-name">${a.name}</span><span class="acc-desc">${a.desc}</span><span class="acc-price">${a.price}</span></div>`
  ).join("");
}
function setLang(l){LANG=l;render();}
render();
</script>
